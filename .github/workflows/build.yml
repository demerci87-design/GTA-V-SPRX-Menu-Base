name: Compile PS3 SPRX
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    # C'est cette ligne qui fait toute la magie :
    container: ps3dev/ps3dev:latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: |
          make

      - name: Upload SPRX
        uses: actions/upload-artifact@v4
        with:
          name: MonMenuPS3
          path: ADF_Menu.sprx
