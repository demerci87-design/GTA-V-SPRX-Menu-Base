- name: Préparer les outils de compilation
        run: |
          sudo apt-get update
          # Ajout de libelf-dev ici
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev libssl-dev libelf-dev
          
          git clone https://github.com/ps3dev/ps3toolchain.git
          cd ps3toolchain
          ./toolchain.sh
          echo "$(pwd)/bin" >> $GITHUB_PATH
