- name: Préparer les outils de compilation
        run: |
          sudo apt-get update
          # Installation complète de toutes les dépendances requises
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev libssl-dev libelf-dev libtool automake
          
          git clone https://github.com/ps3dev/ps3toolchain.git
          cd ps3toolchain
          ./toolchain.sh
          # Ajout du dossier bin au PATH pour que 'make' trouve ppu-g++
          echo "$(pwd)/bin" >> $GITHUB_PATH
