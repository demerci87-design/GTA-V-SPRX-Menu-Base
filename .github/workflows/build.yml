name: Compile PS3 SPRX
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Compile
        run: |
          # Lance la commande définie dans ton Makefile
          make
      - name: Upload SPRX
        uses: actions/upload-artifact@v3
        with:
          name: MonMenuPS3
          path: ADF_Menu.sprx
