name: Compile PS3 SPRX
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer les outils de compilation
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev libssl-dev
          # On clone la toolchain que tu as trouvée
          git clone https://github.com/ps3dev/ps3toolchain.git
          cd ps3toolchain
          # On lance la construction (ça va créer ppu-g++ pour toi)
          ./toolchain.sh
          # On ajoute les outils au chemin système
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Compiler le menu
        run: |
          make

      - name: Récupérer le fichier .sprx
        uses: actions/upload-artifact@v4
        with:
          name: MonMenuPS3
          path: ADF_Menu.sprx
