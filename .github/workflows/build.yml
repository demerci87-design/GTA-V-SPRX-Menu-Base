name: Compile PS3 SPRX
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    # Cette ligne fait toute la différence : on utilise un environnement PS3 prêt à l'emploi
    container: ghcr.io/ps3dev/ps3dev:latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Compiler avec PS3DEV
        run: |
          # On exécute simplement ton Makefile
          make

      - name: Récupérer le menu
        uses: actions/upload-artifact@v4
        with:
          name: MonMenuPS3
          path: ADF_Menu.sprx
