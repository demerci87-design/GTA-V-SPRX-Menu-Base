name: Compile PS3 SPRX
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On utilise l'installateur automatique de la communauté
      - name: Setup PS3Dev Toolchain
        run: |
          docker run --rm -v ${{ github.workspace }}:/src -w /src ghcr.io/ps3dev/ps3dev:latest make
