name: Compile PS3 SPRX
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Compilateur PS3
        run: |
          # Mise à jour et installation des outils de base
          sudo apt-get update
          sudo apt-get install -y build-essential curl
          
          # On télécharge les binaires pré-compilés de la toolchain (plus simple)
          curl -L https://github.com/ps3dev/ps3toolchain/releases/latest/download/ps3dev-linux.tar.gz -o ps3dev.tar.gz
          tar -xzf ps3dev.tar.gz
          echo "$(pwd)/ps3dev/bin" >> $GITHUB_PATH

      - name: Compilation
        run: |
          make

      - name: Récupérer le menu
        uses: actions/upload-artifact@v4
        with:
          name: MonMenuPS3
          path: ADF_Menu.sprx
