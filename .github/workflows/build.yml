name: Compile PS3 SPRX

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev libssl-dev libelf-dev libtool automake
          git clone https://github.com/ps3dev/ps3toolchain.git
          cd ps3toolchain
          ./toolchain.sh
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Compiler le menu
        run: make

      - name: Récupérer le .sprx
        uses: actions/upload-artifact@v4
        with:
          name: MonMenuPS3
          path: ADF_Menu.sprx
