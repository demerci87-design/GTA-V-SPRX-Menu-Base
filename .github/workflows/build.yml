name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/ps3dev:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADF_Menu
          path: ADF_Menu.sprx
