name: Compile PS3 SPRX
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Étape 1 : Téléchargement et extraction (Déjà validé au vert !)
      - name: Download PS3 SDK Tools
        run: |
          sudo apt-get update && sudo apt-get install -y p7zip-full
          curl -L -o ps3_sdk.7z "https://archive.org/download/ps3-4.75-sdk/PS3%204.75%20SDK%20Offline%20Installer.7z"
          7z x ps3_sdk.7z -o./ps3_sdk_extracted
          
          # Correction du chemin exact vers le compilateur ppu-g++ de Sony
          echo "$(pwd)/ps3_sdk_extracted/cell/host-linux-x86/bin" >> $GITHUB_PATH

      # Étape 2 : Compilation automatique
      - name: Compile
        run: |
          make

      # Étape 3 : Récupération du fichier final
      - name: Upload SPRX
        uses: actions/upload-artifact@v4
        with:
          name: MonMenuPS3
          path: ADF_Menu.sprx
          
